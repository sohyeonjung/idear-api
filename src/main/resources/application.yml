spring:
  application:
    name: idear-api
  profiles:
    active: local # 기본 active profile
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  task:
    scheduling:
      enabled: false
  mail:
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

idear:
  crawler:
    enabled: false

server:
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

cloud:
  aws:
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    bucket: idear-file
    region:
      static: ap-northeast-2

secret:
  jwt:
    key: ${JWT_KEY}
    access:
      expiration: 1209600000
    refresh:
      expiration: 1209600000

blockchain:
  gateway:
    url: ${BLOCKCHAIN_GATEWAY_URL}
  server:
    private-key: ${SERVER_PRIVATE_KEY}
  contract:
    address: ${BLOCKCHAIN_CONTRACT_ADDRESS}
  signature:
    verification-enabled: true        # 사용자 전자서명 서버 검증
  scheduler:
    enabled: true                     # Outbox 릴레이 + 대사 배치
  outbox:
    relay-interval-ms: 2000
    batch-size: 20
    max-attempts: 5                   # 초과 시 DEAD(Dead Letter) + FAILED(gateway_unreachable)
    base-backoff-ms: 2000             # 2s, 4s, 8s ... 지수 백오프
    max-backoff-ms: 300000
  reconciliation:
    interval-ms: 60000
    grace-seconds: 120                # 정상 경로(웹훅)에 먼저 기회를 주는 시간
    stuck-threshold-seconds: 600      # 이 시간 동안 체인에 없으면 재전송
    max-dispatch: 3                   # 재전송 포함 최대 전송 횟수, 초과 시 FAILED(reconciliation_timeout)
    failed-lookback-hours: 24         # FAILED 건도 이 기간 동안은 체인을 재확인

user:
  profile:
    default-image-url: ${USER_DEFAULT_PROFILE_IMAGE_URL:https://idear-file.s3.ap-northeast-2.amazonaws.com/profile-images/default-image.png}
    max-image-size: ${USER_PROFILE_MAX_IMAGE_SIZE:5242880} # 5MB in bytes
    allowed-extensions: ${USER_PROFILE_ALLOWED_EXTENSIONS:jpg,jpeg,png,gif,webp}
  email:
    verification:
      code-expiration-minutes: ${EMAIL_VERIFICATION_CODE_EXPIRATION:5}
      verified-expiration-minutes: ${EMAIL_VERIFIED_EXPIRATION:10}

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${LOCAL_MYSQL_URL}
    username: ${LOCAL_MYSQL_USER}
    password: ${LOCAL_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show-sql: true

  front:
    origin: ${FRONT_ORIGIN_LOCAL}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: ${KAKAO_REDIRECT_URI_LOCAL}
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email

          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: ${NAVER_REDIRECT_URI_LOCAL}
            authorization-grant-type: authorization_code
            scope: name,email

          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI_LOCAL}
            authorization-grant-type: authorization_code
            scope: profile,email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${PROD_MYSQL_URL}
    username: ${PROD_MYSQL_USER}
    password: ${PROD_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update # Migration 도구 사용 고려 (validate)
    properties:
      hibernate:
        show-sql: false

  front:
    origin: ${FRONT_ORIGIN}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email

          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: ${NAVER_REDIRECT_URI}
            authorization-grant-type: authorization_code
            scope: name,email

          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            authorization-grant-type: authorization_code
            scope: profile,email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
